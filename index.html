<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plan de Table</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

    <style>

        :root {
            --gold: #b68c54;
            --gold-light: #d8b785;
            --cream: #faf7f2;
            --text: #5b4f42;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: radial-gradient(circle at top left,#ffffff 0%,#faf7f2 40%,#f4eee5 100%);
            font-family: 'Montserrat',sans-serif;
            position: relative;
        }

        /* Décor floral */

        .floral {
            position: absolute;
            color: rgba(182,140,84,0.18);
            pointer-events: none;
        }

        .top-left {
            top: -30px;
            left: -30px;
        }

        .bottom-right {
            bottom: -30px;
            right: -30px;
            transform: rotate(180deg);
        }

        svg {
            width: 260px;
            height: 260px;
        }

        .card {
            width: min(90%,700px);
            padding: 70px 40px;
            text-align: center;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(182,140,84,.20);
            border-radius: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,.06), 0 0 0 8px rgba(255,255,255,.3);
            animation: fadeIn 1.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome {
            font-family: 'Cormorant Garamond',serif;
            font-size: 4rem;
            color: var(--gold);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .line {
            width: 140px;
            height: 1px;
            margin: 25px auto 40px;
            background: linear-gradient( to right, transparent, var(--gold), transparent );
        }

        .table-name {
            font-family: 'Cormorant Garamond',serif;
            font-size: 4.2rem;
            color: var(--text);
            font-weight: 600;
            line-height: 1.2;
        }

        .subtitle {
            margin-top: 30px;
            color: #8a7c6c;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .signature {
            margin-top: 50px;
            color: var(--gold);
            font-family: 'Cormorant Garamond',serif;
            font-size: 1.4rem;
        }

        @media(max-width:768px) {

            .card {
                padding: 60px 25px;
            }

            .welcome {
                font-size: 2.8rem;
            }

            .table-name {
                font-size: 2.8rem;
            }

            svg {
                width: 180px;
                height: 180px;
            }
        }
        .search-container {
            width: 100%;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        #guestSearch {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid #d9d9d9;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            outline: none;
            box-sizing: border-box;
        }

            #guestSearch:focus {
                border-color: #b68c54;
            }

        #result {
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="floral top-left">
        <svg viewBox="0 0 200 200" fill="none">
            <path d="M20 180 C60 90 120 80 180 20" stroke="currentColor" stroke-width="2" />
            <path d="M50 150 C70 130 80 110 90 90" stroke="currentColor" />
            <path d="M70 120 C90 110 105 95 110 70" stroke="currentColor" />
            <path d="M40 160 C60 140 75 135 90 130" stroke="currentColor" />
        </svg>
    </div>

    <div class="floral bottom-right">
        <svg viewBox="0 0 200 200" fill="none">
            <path d="M20 180 C60 90 120 80 180 20" stroke="currentColor" stroke-width="2" />
            <path d="M50 150 C70 130 80 110 90 90" stroke="currentColor" />
            <path d="M70 120 C90 110 105 95 110 70" stroke="currentColor" />
            <path d="M40 160 C60 140 75 135 90 130" stroke="currentColor" />

    <div class="card">

        </div>

        </div>

        <div class="search-container">

            <input type="text"
                   id="guestSearch"
                   placeholder="Vérification invité......">

            <div id="result"></div>


        </div>
    </div>

        // =========================
        // TABLE COURANTE
        // =========================

        const params = new URLSearchParams(window.location.search);

        const id = params.get("id") || "10";

        document.getElementById("tableName").textContent =
            tables[id] || "Trésor";

        // =========================
        // RECHERCHE
        // =========================

        function normalize(text) {
            return text
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .trim();
        }

        function matchGuestInList(guestList, search) {
            for (const group of guestList) {
                // 1. Recherche directe dans la chaîne entière du groupe
                if (normalize(group).includes(search)) {
                    return group;
                }

                // 2. Découpage par membres
                const members = group
                    .split(/\+|&| et /i)
                    .map(x => x.trim());

                for (const member of members) {
                    if (normalize(member).includes(search)) {
                        return group;
                    }
                }
            }
            return null;
        }

        function searchGuest() {
            const query = document.getElementById("guestSearch").value.trim();
            const result = document.getElementById("result");

            if (query === "") {
                result.innerHTML = "";
                return;
            }

            const search = normalize(query);

            // 1. Recherche sur la table actuelle (id)
            const currentGuests = guests[id] || [];
            let foundGroup = matchGuestInList(currentGuests, search);
            let foundTableId = id;
            let isCurrentTable = true;

            // 2. Si non trouvé sur la table actuelle, recherche globale
            if (!foundGroup) {
                for (const tableKey in guests) {
                    if (tableKey == id) continue; // On évite de re-tester la table courante

                    const matchedGroup = matchGuestInList(guests[tableKey], search);
                    if (matchedGroup) {
                        foundGroup = matchedGroup;
                        foundTableId = tableKey;
                        isCurrentTable = false;
                        break;
                    }
                }
            }

            // 3. Affichage des résultats
            if (foundGroup) {
                // Style ajusté si l'invité est sur la table courante ou sur une autre table
                const bg = isCurrentTable ? "#eaf9ef" : "#fff8e6";
                const color = isCurrentTable ? "#1f8f4d" : "#b7791f";
                const border = isCurrentTable ? "#cbe7d3" : "#f6e0b5";
                const statusText = isCurrentTable
                    ? "✅ Invitation valide pour cette table"
                    : "⚠️ Invité trouvé sur une autre table";

                result.innerHTML = `
            <div style="
                background:${bg};
                color:${color};
                padding:16px;
                border-radius:12px;
                margin-top:15px;
                border:1px solid ${border};
            ">
                <strong>${statusText}</strong>

                <br><br>

                <strong>Groupe :</strong><br>
                ${foundGroup}

                <br><br>

                <strong>Table :</strong>
                ${tables[foundTableId]} (Table ${foundTableId})
            </div>
        `;
            } else {
                // Message si l'invité n'est sur aucune table
                result.innerHTML = `
            <div style="
                background:#fff1f1;
                color:#b71c1c;
                padding:16px;
                border-radius:12px;
                margin-top:15px;
                border:1px solid #f0caca;
            ">
                <strong>❌ Nom trouvé sur aucune table</strong> <br>
                <strong>Veuillez vérifier l'orthographe ou contacter l'organisateur.</strong>
            </div>
        `;
            }
        }

        // Recherche instantanée
        document.addEventListener("DOMContentLoaded", () => {
            const input = document.getElementById("guestSearch");
            if (input) {
                input.addEventListener("input", searchGuest);
            }
        });

    </script>
