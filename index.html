    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plan de Table</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

    <style>

        :root {
            --gold: #b68c54;
            --gold-light: #d8b785;
            --cream: #faf7f2;
            --text: #5b4f42;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: radial-gradient(circle at top left,#ffffff 0%,#faf7f2 40%,#f4eee5 100%);
            font-family: 'Montserrat',sans-serif;
            position: relative;
        }

        /* Décor floral */

        .floral {
            position: absolute;
            color: rgba(182,140,84,0.18);
            pointer-events: none;
        }

        .top-left {
            top: -30px;
            left: -30px;
        }

        .bottom-right {
            bottom: -30px;
            right: -30px;
            transform: rotate(180deg);
        }

        svg {
            width: 260px;
            height: 260px;
        }

        .card {
            width: min(90%,700px);
            padding: 70px 40px;
            text-align: center;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(182,140,84,.20);
            border-radius: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,.06), 0 0 0 8px rgba(255,255,255,.3);
            animation: fadeIn 1.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome {
            font-family: 'Cormorant Garamond',serif;
            font-size: 4rem;
            color: var(--gold);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .line {
            width: 140px;
            height: 1px;
            margin: 25px auto 40px;
            background: linear-gradient( to right, transparent, var(--gold), transparent );
        }

        .table-name {
            font-family: 'Cormorant Garamond',serif;
            font-size: 4.2rem;
            color: var(--text);
            font-weight: 600;
            line-height: 1.2;
        }

        .subtitle {
            margin-top: 30px;
            color: #8a7c6c;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .signature {
            margin-top: 50px;
            color: var(--gold);
            font-family: 'Cormorant Garamond',serif;
            font-size: 1.4rem;
        }

        @media(max-width:768px) {

            .card {
                padding: 60px 25px;
            }

            .welcome {
                font-size: 2.8rem;
            }

            .table-name {
                font-size: 2.8rem;
            }

            svg {
                width: 180px;
                height: 180px;
            }
        }
        .search-container {
            width: 100%;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        #guestSearch {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid #d9d9d9;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            outline: none;
            box-sizing: border-box;
        }

            #guestSearch:focus {
                border-color: #b68c54;
            }

        #result {
            margin-top: 10px;
        }
    </style>
</head>

            const params = new URLSearchParams(window.location.search);

            const id = params.get("id") || "1";

            document.getElementById("tableName").textContent =
                tables[id] || "Paix";

            // =========================
            // RECHERCHE
            // =========================

            function normalize(text) {
                return text
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .toLowerCase()
                    .trim();
            }

            function searchGuest() {

                const query =
                    document.getElementById("guestSearch")
                        .value
                        .trim();

                const result =
                    document.getElementById("result");

                if (query === "") {
                    result.innerHTML = "";
                    return;
                }

                const currentGuests = guests[id] || [];

                const search = normalize(query);

                let found = null;

                for (const group of currentGuests) {

                    if (normalize(group).includes(search)) {
                        found = group;
                        break;
                    }

                    const members = group
                        .split(/\+|&| et /i)
                        .map(x => x.trim());

                    for (const member of members) {

                        if (normalize(member).includes(search)) {

                            found = group;
                            break;
                        }

                    }

                    if (found) break;
                }

                if (found) {

                    result.innerHTML = `
                            <div style="
                                background:#eaf9ef;
                                color:#1f8f4d;
                                padding:16px;
                                border-radius:12px;
                                margin-top:15px;

                                ${found}

                                <br><br>

                                ${tables[id]}
                            </div>
                            `;

                } else {

                    result.innerHTML = `

                                color:#b71c1c;
                                padding:16px;
                                border-radius:12px;
                                margin-top:15px;
                                border:1px solid #f0caca;
                            ">
                                <strong>❌ Nom non trouvé sur cette table</strong>
                            </div>
                            `;

                }
            }

                const input =
                    document.getElementById("guestSearch");

                if (input) {

                    input.addEventListener("input", searchGuest);

                }
